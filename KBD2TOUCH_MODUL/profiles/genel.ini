# ===================================================================
#  GENEL PROFIL — her uygulamada calisan temel eslesmeler
#  (config.ini'deki [bind:...] bolumleri de ayni isi gorur; burasi
#   hizla deneme yapman icin bos sablon.)
#
#  Yeni oyun icin: bu dosyayi kopyala, adini
#     <paket_adi>.ini   ornek: com.tencent.ig.ini
#  yap. Paket adini bulmak icin:
#     adb shell dumpsys window | grep mCurrentFocus
# ===================================================================

# Ornek: ekranin ortasina dokun
#[bind:SPACE]
#action = tap
#x = 1440
#y = 900

# Ornek: soldan saga kaydir
#[bind:RIGHT]
#action = swipe
#x = 700
#y = 900
#x2 = 2100
#y2 = 900
#ms = 140

# Ornek: basili tutarak surukle (joystick)
#[bind:W]
#action = swipe
#x = 620
#y = 1240
#x2 = 620
#y2 = 1030
#hold = 1

# Ornek: otomatik ates (tus basiliyken 90 ms'de bir dokun)
#[bind:J]
#action = tap
#x = 2790
#y = 1450
#repeat_ms = 90
