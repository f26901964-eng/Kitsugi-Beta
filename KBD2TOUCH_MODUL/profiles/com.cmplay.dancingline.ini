# ===================================================================
#  DANCING LINE  (paket: com.cmplay.dancingline)
#  Bu dosya /data/adb/kbd2touch/profiles/ icinde durmali.
#  Dosya adi = paket adi -> daemon oyunu gorunce bu eslesmeleri kullanir.
#
#  Ekran: 2880x1800 (yatay). Koordinatlar "Gelistirici secenekleri ->
#  Isaretci konumu" acikken oyuna dokunarak okudugun degerler olmali.
# ===================================================================

# Oyun ici tek dokunus (yön degistir). Ekranda nerede oldugu onemli degil,
# ama HUD butonlarina (duraklat/sag ust) denk gelmesin diye sol-alt bosluk.
[bind:SPACE]
action = tap
x = 700
y = 1500
label = dokun / yön degistir

[bind:ENTER]
action = tap
x = 700
y = 1500
label = dokun (alternatif)

# Klavyenin yanindaki touchpad'ten tik da ayni isi yapsin
[bind:BTN_LEFT]
action = tap
x = 700
y = 1500
label = dokun (tik)

# --- Ana menude bolum sayfalarini gecme ---
# Saga/sola kaydirma: sayfa gecisi
[bind:RIGHT]
action = swipe
x  = 2100
y  = 900
x2 = 700
y2 = 900
ms = 140
label = sonraki bolum

[bind:LEFT]
action = swipe
x  = 700
y  = 900
x2 = 2100
y2 = 900
ms = 140
label = onceki bolum

# Yukari/asagi: menu listesinde gezinme.
# Cogu Android menusunde OK TUŞLARI ZATEN ÇALIŞIR; calismiyorsa bu
# koordinatlari menudeki ogelerin uzerine tasi.
[bind:DOWN]
action = tap
x = 1440
y = 1150
label = asagidaki oge

[bind:UP]
action = tap
x = 1440
y = 750
label = yukaridaki oge

# Oyna / devam butonu (ekranin ortasindaki büyük buton)
[bind:E]
action = tap
x = 1440
y = 1450
label = oyna

# Duraklat (sag ust)
[bind:P]
action = tap
x = 2790
y = 90
label = duraklat

# Tekrar oyna / devam et ekrani
[bind:R]
action = tap
x = 1440
y = 1300
label = tekrar
