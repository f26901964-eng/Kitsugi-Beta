# ===================================================================
#  GTA SAN ANDREAS — DOKUNMATIK ESLEME  (com.rockstargames.gtasa)
#
#  ONEMLI: Asagidaki koordinatlar TAHMINIDIR. Kendi HUD duzenine gore
#  ayarlaman gerekir:
#    1) Gelistirici secenekleri -> "Isaretci konumu"nu AC
#    2) Oyunda her butona parmaginla bir kez dokun
#    3) Ekranin ustunde cikan X/Y degerini buraya yaz
#  Ekran: 2880x1800 yatay.
#
#  NOT: GTA SA Android surumu KLAVYEYI yerel olarak desteklemez ama
#  OYUN KOLUNU destekler. En temiz yol: config.ini icinde gamepad=1
#  yapip "gtasa_gamepad.ini" profilini kullanmak.
# ===================================================================

# --- Sol analog: WASD ile surukleme (basili tut) ---
# Joystick merkezi ~ (620, 1240). Hareket mesafesini kendine gore ayarla.
[bind:W]
action = swipe
x  = 620
y  = 1240
x2 = 620
y2 = 1030
ms = 100
hold = 1
label = ileri

[bind:S]
action = swipe
x  = 620
y  = 1240
x2 = 620
y2 = 1450
ms = 100
hold = 1
label = geri

[bind:A]
action = swipe
x  = 620
y  = 1240
x2 = 410
y2 = 1240
ms = 100
hold = 1
label = sol

[bind:D]
action = swipe
x  = 620
y  = 1240
x2 = 830
y2 = 1240
ms = 100
hold = 1
label = sag

