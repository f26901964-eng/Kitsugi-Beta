# ===================================================================
#  GTA SAN ANDREAS — SANAL GAMEPAD PROFILI  (PC tuslari gibi)
#
#  Bu profili F10 ile sectigin an sanal Xbox kolu OTOMATIK olusur
#  (config'te gamepad = 1 yapmana gerek yok). Oyun "kol bagli" moduna
#  gecince analog surus, nisan alma ve titresim dogal calisir.
#
#  Asagidaki [app] bolumu bu profilin hangi oyunda otomatik devreye
#  girecegini belirler. Dokunmatik profili (com.rockstargames.gtasa.ini)
#  ile AYNI ANDA kullanma - ikisi de ayni pakete bagli olursa karisir.
#  Istedigini sec: ya bu dosyayi birak, ya dokunmatik olani sil/devre disi birak.
# ===================================================================

[app]
package = com.rockstargames.gtasa
# auto = 0 -> bu profil OTOMATIK devreye girmez, sadece F10 ile secilir.
# Boylece dokunmatik GTA profili (com.rockstargames.gtasa.ini) ile cakismaz.
auto = 0

# --- Sol analog: yurume / arac surme ---
[bind:W]
action = gamepad_stick
axis = LY
gy   = -32767
label = ileri

[bind:S]
action = gamepad_stick
axis = LY
gy   = 32767
label = geri

[bind:A]
action = gamepad_stick
axis = LX
gx   = -32767
label = sol

[bind:D]
action = gamepad_stick
axis = LX
gx   = 32767
label = sag

# Capraz hareket icin (W+A gibi) ikili kombinasyon: WX/WZ... basit tutmak
# icin caprazlarda analog yerine yon tuslarini da kullanabilirsin:
[bind:UP]
action = gamepad_stick
axis = RY
gy   = -32767
label = kamera yukari

[bind:DOWN]
action = gamepad_stick
axis = RY
gy   = 32767
label = kamera asagi

[bind:LEFT]
action = gamepad_stick
axis = RX
gx   = -32767
label = kamera sol

[bind:RIGHT]
action = gamepad_stick
axis = RX
gx   = 32767
label = kamera sag

# --- Butonlar (PC GTA SA karsiligi) ---
[bind:SPACE]
action = gamepad_button
button = A
label = ziPla / el freni

[bind:F]
action = gamepad_button
button = Y
label = araca bin-in

[bind:J]
action = gamepad_button
button = B
label = saldir / ates

[bind:L]
action = gamepad_button
button = LT
label = nisan al (tetik)

[bind:SHIFT]
action = gamepad_button
button = LT
label = kos (tetik basili)

[bind:C]
action = gamepad_button
button = RT
label = egil / ates (tetik)

[bind:R]
action = gamepad_button
button = X
label = sarjor

[bind:Q]
action = gamepad_button
button = SELECT
label = silah degistir

[bind:TAB]
action = gamepad_button
button = SELECT
label = harita

[bind:ESC]
action = gamepad_button
button = START
label = duraklat

[bind:1]
action = gamepad_button
button = THUMBL
label = slot/radar
