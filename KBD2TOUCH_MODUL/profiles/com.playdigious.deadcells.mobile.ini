# ===================================================================
#  DEAD CELLS (Playdigious) — SANAL XBOX GAMEPAD PROFILI  (v1.0.5)
#  paket: com.playdigious.deadcells.mobile
#
#  NASIL CALISIR:
#   - Dead Cells mobil surumu KLAVYEYI native desteklemez, ama
#     KONTROLOR destegi mukemmeldir (resmi wiki: "It is recommended
#     to play with a controller").
#   - Bu profil aktifken kbd2touch sanal bir "Microsoft X-Box 360 pad"
#     OTOMATIK olusturur ve oyun boyunca KALDIRMAZ (gamepad_sticky=1:
#     Unity hotplug'da kolu yeniden taramaz — pad sabit kalmali).
#   - v1.0.5: eksen araliklari -32768..32767 (merkez 0) — eski
#     surumdeki "karakter kendi kendine sola kosuyor" hatasi giderildi.
#
#  TUS DUZENI = PC klavye varsayilani (resmi deadcells.wiki.gg/Controls):
#   HAREKET   A / D  veya SOL/SAG ok     -> sol analog (2B oyun: sadece X)
#   ZIPLA     Space / W                  -> A     (PC'de UP de ziplar ama
#                                            biz UP'i MENU icin sakliyoruz)
#   EGIL/DUS  S veya ASAGI ok            -> sol analog asagi
#                                           (S+Space = platformdan dus =
#                                            oyundaki "asagi + A", birebir)
#   YUKARI    UP ok veya I               -> sol analog yukari
#                                           (MENULERDE yukari gezin + oyunda
#                                            asma/zincir tirmanma)
#   MENU      UP/DOWN/LEFT/RIGHT gezinir, Space/W = onayla (A),
#             Shift/Ctrl = geri (B), Esc = duraklat (START), Tab = harita
#   TAKLA     Shift veya Ctrl            -> B
#   ANA SILAH 1 veya J veya SOL TIK      -> X
#   IKINCI    2 veya K veya SAG TIK      -> Y
#   SOL BECERI Q veya 3                  -> LT
#   SAG BECERI E veya 4                  -> RT
#   IYALESTIR F veya H veya ORTA TIK     -> LB
#   KULLAN/ETKILES R                     -> RB   (basili: sirt cantasi bosalt)
#   HARITA    Tab                        -> SELECT
#   DURAKLAT  Esc                        -> START
#
#  NOTLAR:
#   - Yay/uzaktan silah nisan alma kol modunda SAG ANALOG iledir; bu
#     profil ok tuslarini PC aliskanligiyla HAREKET/ZIPLAMA'ya verir.
#     Dead Cells'te kontrolor nisan yardimi (aim assist) aktif oldugu
#     icin cogu durumda gerekmez. Fare hareketiyle nisan (mouse_aim)
#     istenirse sonraki surumde eklenebilir.
#   - Vucuttan cikma (R3) gerekirse asagidaki ornegi ac:
#     [bind:V] / action = gamepad_button / button = THUMBR
#   - Tuslar oyun icinde de yeniden atanabilir; oyun A/B/X/Y gosterir,
#     bu profil o gosterimle birebir uyumlu.
# ===================================================================

[app]
package = com.playdigious.deadcells.mobile

# --- HAREKET: sol analog X (PC: A/D ve sol/sag ok) ---
[bind:A]
action = gamepad_stick
axis = LX
gx   = -32767
label = sola yurume

[bind:D]
action = gamepad_stick
axis = LX
gx   = 32767
label = saga yurume

[bind:LEFT]
action = gamepad_stick
axis = LX
gx   = -32767
label = sola yurume (ok — PC alternatifi)

[bind:RIGHT]
action = gamepad_stick
axis = LX
gx   = 32767
label = saga yurume (ok — PC alternatifi)

# --- EGILME / PLATFORMDAN DUSME / ASAGI TIRMANMA: sol analog asagi ---
[bind:S]
action = gamepad_stick
axis = LY
gy   = 32767
label = egil / asagi (S+Space = platformdan dus)

[bind:DOWN]
action = gamepad_stick
axis = LY
gy   = 32767
label = egil / asagi (ok — PC alternatifi)

# --- TIRMANMA: sol analog yukari (zincir/asma) ---
[bind:I]
action = gamepad_stick
axis = LY
gy   = -32767
label = yukari tirman (asma/zincir)

# --- ZIPLAMA: A butonu (PC'de Space/W/yukari-ok ucunun de zipla) ---
[bind:SPACE]
action = gamepad_button
button = A
label = ziPla (PC: Space)

[bind:W]
action = gamepad_button
button = A
label = ziPla (PC: W)

[bind:UP]
action = gamepad_stick
axis = LY
gy   = -32767
label = menu yukari / asma-zincir tirman (ziplama: Space veya W)

# --- TAKLA / DODGE: B (PC: Shift veya Ctrl) ---
[bind:SHIFT]
action = gamepad_button
button = B
label = takla (PC: Shift)

[bind:CTRL]
action = gamepad_button
button = B
label = takla (PC: Ctrl)

# --- SILAHLAR: X ana, Y ikinci (PC: 1/2 veya sol/sag tik) ---
[bind:1]
action = gamepad_button
button = X
label = ana silah (PC: 1 / sol tik)

[bind:J]
action = gamepad_button
button = X
label = ana silah (alternatif)

[bind:2]
action = gamepad_button
button = Y
label = ikinci silah (PC: 2 / sag tik)

[bind:K]
action = gamepad_button
button = Y
label = ikinci silah (alternatif)

# --- BECERILER: LT/RT (PC: Q/E veya 3/4) ---
[bind:Q]
action = gamepad_button
button = LT
label = sol beceri (PC: Q)

[bind:3]
action = gamepad_button
button = LT
label = sol beceri (PC: 3)

[bind:E]
action = gamepad_button
button = RT
label = sag beceri (PC: E)

[bind:4]
action = gamepad_button
button = RT
label = sag beceri (PC: 4)

# --- KULLAN / IYALESTIR ---
[bind:R]
action = gamepad_button
button = RB
label = kullan / etkiles (PC: R)

[bind:F]
action = gamepad_button
button = LB
label = iyilestir - iksir (PC: F)

[bind:H]
action = gamepad_button
button = LB
label = iyilestir - iksir (PC: H)

# --- MENU ---
[bind:TAB]
action = gamepad_button
button = SELECT
label = harita

[bind:ESC]
action = gamepad_button
button = START
label = duraklat

# --- Fare (BT/USB): PC'deki gibi tiklarla oyna ---
# (fare sadece bu oyun acikken yakalanir; masaustunde imlec normal calisir)
[bind:SOL_TIK]
action = gamepad_button
button = X
label = ana silah (PC: sol tik)

[bind:SAG_TIK]
action = gamepad_button
button = Y
label = ikinci silah (PC: sag tik)

[bind:ORTA_TIK]
action = gamepad_button
button = LB
label = iyilestir (PC: orta tik)

# --- Istege bagli: vucuttan cikma (R3) ---
# [bind:V]
# action = gamepad_button
# button = THUMBR
# label = vucuttan cik / gir
