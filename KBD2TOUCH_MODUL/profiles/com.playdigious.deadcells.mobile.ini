# ===================================================================
#  DEAD CELLS (Playdigious) — SANAL XBOX GAMEPAD PROFILI
#  paket: com.playdigious.deadcells.mobile
#
#  NASIL CALISIR:
#   - Dead Cells mobil surumu KLAVYEYI native desteklemez, ama
#     KONTROLOR destegi mukemmeldir (PS4/Xbox/8BitDo — resmi wiki ve
#     Playdigious duyurulariyla dogrulandi; oyun "kontrolor oyunu"
#     olarak tasarlanmis).
#   - Bu profil aktifken kbd2touch sanal bir "Microsoft X-Box 360 pad"
#     OTOMATIK olusturur (config'te gamepad = 1 yapmana GEREK YOK).
#   - Oyun kontroloru gorunce kendisi kol moduna gecer: ekrandaki tus
#     ipuclari A/B/X/Y olur, girdiyi DOGAL okur. Dokunma taklidi yok,
#     koordinat kalibrasyonu yok, gecikme minimum.
#   - Oyundan cikinca sanal kol otomatik kaldirilir.
#
#  TUS DUZENI = PC klavye varsayilanlari (resmi Dead Cells wiki):
#   W/A/S/D    hareket (sol analog)      Space   ziPla          (A)
#   Shift/Ctrl takla / dodge-roll       (B)     1 veya J  ana silah    (X)
#   2 veya K   ikinci silah             (Y)     Q veya 3  sol beceri   (LT)
#   E veya 4   sag beceri               (RT)    R         kullan/etkiles (RB)
#   F veya H   iyilestir (iksir)        (LB)    Tab       harita       (SELECT)
#   ESC        duraklat                 (START) Ok tuslari kamera/nisan (sag analog)
#
#  IPUCLARI:
#   - Platformdan dusme / havada saldiri: S + Space birlikte bas
#     (oyundaki "Down + Jump" = sol analog asagi + A).
#   - Yay/uzaktan silah nisan alma: sag analog (ok tuslari).
#   - Oyun icindeki ayarlarda kontrolor tuslari yeniden atanabilir;
#     oyun A/B/X/Y gosterdigi icin bu profil birebir uyumlu.
#   - Vucuttan cikma (R3) gerekirse asagidaki ornegi ac:
#     [bind:V] / action = gamepad_button / button = THUMBR
# ===================================================================

[app]
package = com.playdigious.deadcells.mobile

# --- Sol analog: hareket (PC: WASD) ---
[bind:W]
action = gamepad_stick
axis = LY
gy   = -32767
label = yukari / tirmanma

[bind:S]
action = gamepad_stick
axis = LY
gy   = 32767
label = asagi / egilme (S+Space = platformdan dus)

[bind:A]
action = gamepad_stick
axis = LX
gx   = -32767
label = sol

[bind:D]
action = gamepad_stick
axis = LX
gx   = 32767
label = sag

# --- Sag analog: kamera / yay nisan alma (ok tuslari) ---
[bind:UP]
action = gamepad_stick
axis = RY
gy   = -32767
label = kamera yukari

[bind:DOWN]
action = gamepad_stick
axis = RY
gy   = 32767
label = kamera asagi

[bind:LEFT]
action = gamepad_stick
axis = RX
gx   = -32767
label = kamera sol

[bind:RIGHT]
action = gamepad_stick
axis = RX
gx   = 32767
label = kamera sag

# --- Butonlar: PC klavye varsayilani -> Xbox ---
[bind:SPACE]
action = gamepad_button
button = A
label = ziPla

[bind:SHIFT]
action = gamepad_button
button = B
label = takla (PC: Shift)

[bind:CTRL]
action = gamepad_button
button = B
label = takla (PC: Ctrl)

[bind:1]
action = gamepad_button
button = X
label = ana silah (PC: 1 / sol tik)

[bind:J]
action = gamepad_button
button = X
label = ana silah (alternatif)

[bind:2]
action = gamepad_button
button = Y
label = ikinci silah (PC: 2 / sag tik)

[bind:K]
action = gamepad_button
button = Y
label = ikinci silah (alternatif)

[bind:Q]
action = gamepad_button
button = LT
label = sol beceri (PC: Q)

[bind:3]
action = gamepad_button
button = LT
label = sol beceri (PC: 3)

[bind:E]
action = gamepad_button
button = RT
label = sag beceri (PC: E)

[bind:4]
action = gamepad_button
button = RT
label = sag beceri (PC: 4)

[bind:R]
action = gamepad_button
button = RB
label = kullan / etkiles (PC: R)

[bind:F]
action = gamepad_button
button = LB
label = iyilestir - iksir (PC: F)

[bind:H]
action = gamepad_button
button = LB
label = iyilestir - iksir (PC: H)

[bind:TAB]
action = gamepad_button
button = SELECT
label = harita

[bind:ESC]
action = gamepad_button
button = START
label = duraklat

# --- Istege bagli: vucuttan cikma (R3) ---
# [bind:V]
# action = gamepad_button
# button = THUMBR
# label = vucuttan cik / gir
