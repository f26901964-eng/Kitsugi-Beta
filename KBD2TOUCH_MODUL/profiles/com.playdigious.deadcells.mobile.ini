# ===================================================================
#  DEAD CELLS (Playdigious) — SANAL XBOX GAMEPAD PROFILI  (v1.0.7)
#  paket: com.playdigious.deadcells.mobile
#
#  NASIL CALISIR:
#   - Dead Cells mobil surumu KLAVYEYI native desteklemez, ama
#     KONTROLOR destegi mukemmeldir (resmi wiki: "It is recommended
#     to play with a controller").
#   - Bu profil aktifken kbd2touch sanal bir "Microsoft X-Box 360 pad"
#     OTOMATIK olusturur ve oyun boyunca KALDIRMAZ (gamepad_sticky=1).
#   - v1.0.7: her buton bind'i hold=1 — tus BASILI TUTULUNCA buton da
#     basili kalir (PC davranisi; or. R basili = sirt cantasi bosalt).
#     Coklu-tus hakemligi: Space+W, Shift+Ctrl, A+D, S+Space gibi
#     ayni hedefi paylasan tuslar artik birbirini DUSURMEZ.
#
#  TUS DUZENI = PC klavye+fare varsayilani, BIREBIR
#  (kaynak: resmi deadcells.wiki.gg/Controls — "Keyboard/Mouse controls"):
#
#   PC eylemi                     PC tusu            bizim pad karsiligi
#   ---------------------------   ----------------   -------------------
#   Up (tirman/bak)               W veya ↑           A butonu* / LY yukari
#   Down (egil/in)                S veya ↓           LY asagi
#   Left                          A veya ←           LX sol
#   Right                         D veya →           LX sag
#   Jump                          Space, W, ↑        A  (Space ve W bizde)
#   Roll                          Shift veya Ctrl    B
#   Main Weapon                   Sol TIK veya 1     X
#   Secondary Weapon              Sag TIK veya 2     Y
#   Left Trigger Skill            Q, FareYan1, 3     LT
#   Right Trigger Skill           E, FareYan2, 4     RT
#   Use/Interact (basili: cantayi bosalt)  R         RB (hold=1 !)
#   Heal                          F, H, OrtaTIK      LB
#   Pause                         Esc (veya T)       START
#   Map                           Tab                SELECT
#   Special Action 1 (menude silah degistir) X       BTN_X**
#   Special Action 2 (menude beceri degistir) Y      BTN_Y**
#
#   *  PC'de ↑ hem ziplar hem menude yukari gezinir; daemon oyun ici/menu
#      baglamini ayirt EDEMEZ. Secim: ↑ = LY yukari (menulerde gezin +
#      oyunda asma/zincir tirmanma — PC'deki "Up" eylemi). Ziplama
#      Space/W'de (PC'nin birincil jump tuslari). I de ↑ ile ayni is.
#   ** X/Y tuslari oyun ICINDE pad'in X/Y butonlari oldugu icin ana/ikinci
#      silah olarak da calisir (PC'de oyun icinde islevsizdir); asil gorevi
#      PC'deki gibi MENULERDE ozel eylem 1/2 (duraklatmada silah/beceri
#      degistir, Collector'da siralama/gorunurluk). Istemiyorsan sil/yorumla.
#
#  FARE:
#   - Tiklar birebir PC gibi: sol=ana silah, sag=ikinci, orta=iyilestir,
#     yan tuslar=beceriler (wiki'deki "Left/Right Side Mouse Button").
#   - FARE HAREKETI oyunda HICBIR SEY YAPMAZ — bu PC'de de ayni!
#     (Dead Cells PC'de fareyle nisan ALINMAZ; oyun otomatik nisan yardimi
#     yapar, fare sadece tiklar. Dogrulandi: wiki + oyuncu raporlari.)
#   - Fare yalnizca profili olan uygulama on plandayken yakalanir;
#     oyun disinda imlec normal calisir. BT fare uyuyup yeniden baglanirsa
#     2 sn icinde OTOMATIK bulunur (v1.0.7).
#
#  MENULER (ana menu, duraklat, Collector, sandik/upgrade):
#   ↑↓←→ gezin (dort yön tam), Space/W onayla (A), Shift/Ctrl geri (B),
#   Esc duraklat/ac (START), Tab harita (SELECT), X/Y ozel eylemler.
#
#  KOMBINASYONLAR (PC "Advanced Maneuvers", v1.0.7 hakemligiyle calisir):
#   S + Space  = platformdan dusme ("Down + Jump")
#   Space + Shift = havada takla ("Jump + Roll")
#   ↑ / I      = asma/zincir tirmanma, ↓ = inme
#
#  Ileri ayar: vucuttan cikma (pad R3) gerekirse asagiyi ac:
#     [bind:V] / action = gamepad_button / button = THUMBR / hold = 1
# ===================================================================

[app]
package = com.playdigious.deadcells.mobile

# --- HAREKET: sol analog X (PC: A/D ve sol/sag ok) ---
[bind:A]
action = gamepad_stick
axis = LX
gx   = -32767
label = sola yurume

[bind:D]
action = gamepad_stick
axis = LX
gx   = 32767
label = saga yurume

[bind:LEFT]
action = gamepad_stick
axis = LX
gx   = -32767
label = sola yurume (ok — PC alternatifi)

[bind:RIGHT]
action = gamepad_stick
axis = LX
gx   = 32767
label = saga yurume (ok — PC alternatifi)

# --- EGILME / PLATFORMDAN DUSME / ASAGI: sol analog asagi ---
[bind:S]
action = gamepad_stick
axis = LY
gy   = 32767
label = egil / asagi (S+Space = platformdan dus)

[bind:DOWN]
action = gamepad_stick
axis = LY
gy   = 32767
label = egil / asagi (ok — PC alternatifi)

# --- YUKARI: menude gezin + asmada tirmanma (PC "Up") ---
[bind:UP]
action = gamepad_stick
axis = LY
gy   = -32767
label = menu yukari / asma-zincir tirman (ziplama: Space veya W)

[bind:I]
action = gamepad_stick
axis = LY
gy   = -32767
label = yukari tirman (asma/zincir — ↑ alternatifi)

# --- ZIPLAMA: A butonu (PC: Space/W/↑; bizde Space ve W) ---
[bind:SPACE]
action = gamepad_button
button = A
hold = 1
label = ziPla (PC: Space)

[bind:W]
action = gamepad_button
button = A
hold = 1
label = ziPla (PC: W)

# --- TAKLA / DODGE: B (PC: Shift veya Ctrl) ---
[bind:SHIFT]
action = gamepad_button
button = B
hold = 1
label = takla (PC: Shift)

[bind:CTRL]
action = gamepad_button
button = B
hold = 1
label = takla (PC: Ctrl)

# --- SILAHLAR: X ana, Y ikinci (PC: 1/2 veya sol/sag tik) ---
[bind:1]
action = gamepad_button
button = X
hold = 1
label = ana silah (PC: 1 / sol tik)

[bind:2]
action = gamepad_button
button = Y
hold = 1
label = ikinci silah (PC: 2 / sag tik)

# --- BECERILER: LT/RT (PC: Q/E, 3/4 veya fare yan tuslari) ---
[bind:Q]
action = gamepad_button
button = LT
hold = 1
label = sol beceri (PC: Q)

[bind:3]
action = gamepad_button
button = LT
hold = 1
label = sol beceri (PC: 3)

[bind:FARE_YAN1]
action = gamepad_button
button = LT
hold = 1
label = sol beceri (PC: fare sol yan tusu)

[bind:E]
action = gamepad_button
button = RT
hold = 1
label = sag beceri (PC: E)

[bind:4]
action = gamepad_button
button = RT
hold = 1
label = sag beceri (PC: 4)

[bind:FARE_YAN2]
action = gamepad_button
button = RT
hold = 1
label = sag beceri (PC: fare sag yan tusu)

# --- KULLAN / IYALESTIR ---
[bind:R]
action = gamepad_button
button = RB
hold = 1
label = kullan / etkiles — BASILI TUT: sirt cantasi bosalt (PC: R)

[bind:F]
action = gamepad_button
button = LB
hold = 1
label = iyilestir - iksir (PC: F)

[bind:H]
action = gamepad_button
button = LB
hold = 1
label = iyilestir - iksir (PC: H)

# --- MENU / SISTEM ---
[bind:TAB]
action = gamepad_button
button = SELECT
hold = 1
label = harita (PC: Tab)

[bind:ESC]
action = gamepad_button
button = START
hold = 1
label = duraklat (PC: Esc)

[bind:T]
action = gamepad_button
button = START
hold = 1
label = duraklat (PC alternatif: T)

# --- PC "Special Actions" (menude silah/beceri degistir; oyun icinde X/Y
#     pad butonlari ana/ikinci silah oldugundan oyle de calisir) ---
[bind:X]
action = gamepad_button
button = X
hold = 1
label = ozel eylem 1 — menude silah degistir (PC: X)

[bind:Y]
action = gamepad_button
button = Y
hold = 1
label = ozel eylem 2 — menude beceri degistir (PC: Y)

# --- Fare (BT/USB): PC'deki gibi tiklarla oyna ---
# (fare sadece profili olan oyun acikken yakalanir; disarida imlec normal)
[bind:SOL_TIK]
action = gamepad_button
button = X
hold = 1
label = ana silah (PC: sol tik)

[bind:SAG_TIK]
action = gamepad_button
button = Y
hold = 1
label = ikinci silah (PC: sag tik)

[bind:ORTA_TIK]
action = gamepad_button
button = LB
hold = 1
label = iyilestir (PC: orta tik)

# --- Istege bagli: vucuttan cikma (R3) ---
# [bind:V]
# action = gamepad_button
# button = THUMBR
# hold = 1
# label = vucuttan cik / gir
