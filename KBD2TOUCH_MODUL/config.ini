# ===================================================================
#  Kbd2Touch — ana yapilandirma
#  Konum: /data/adb/kbd2touch/config.ini
#
#  Degisiklikten sonra daemon'u yeniden baslat:
#     su -c "pkill -f kbd2touch; /data/adb/kbd2touch/kbd2touch -c /data/adb/kbd2touch/config.ini &"
#  (veya cihazı yeniden başlat)
# ===================================================================

[global]
# --- Ekran ---
# 'auto' birakirsan service.sh her acilista `wm size` ile otomatik doldurur.
# Xiaomi Pad 6: 2880x1800
screen_width  = auto
screen_height = auto
touch_max_x   = auto
touch_max_y   = auto

# Ekran donusu. YANLIS KOOSE = bu degeri degistir.
# F11 ile kalibrasyon: 4 koseye dokunur, hangi rotation'un dogru oldugunu gorursun.
#   0 / 90 / 180 / 270
rotation = 0
# Gerekirse ek duzeltme (cogunlukla gerekmez):
swap_xy  = 0
invert_x = 0
invert_y = 0

# Dokunusa eklenecek rastgele piksel (anti-detection). Offline oyunlarda 0 birak.
jitter = 0

# Ayni anda basili tutulabilecek parmak sayisi (en fazla 10)
slots = 10

# --- Klavye ---
# 1 = klavyeyi EVIOCGRAB ile tamamen ele gecir (oyun ham tus basimini GORMEZ,
#     boylece "hem tus hem dokunus" cift tetikleme olmaz).
# 0 = klavye hem oyuna hem buraya gider (yazı yazarken sorun cikarabilir).
grab_keyboard = 1

# Klavyeyi kendin secmek istersen (once `kbd2touch --list-devices`):
# device = /dev/input/event3
# veya ismine gore otomatik sec:
# device_match = Xiaomi

# --- Zamanlama ---
tap_ms   = 40     # tek dokunusun basili kalma suresi (ms)
swipe_ms = 90     # surukleme suresi (ms)

# --- Sanal klavye cihazi ---
# action = key eslesmeleri (or. ESC -> geri tusu) icin ayri bir sanal klavye
# cihazi olusturulur. Bazi ROM'larda bu, "fiziksel klavye bagli" sayilip
# ekrandaki yazilim klavyesini gizleyebilir. Sorun olursa 0 yap.
virtual_keyboard = 1

# --- Sanal gamepad (GTA SA gibi yerel kol destegi olan oyunlar icin) ---
# 1 = ayrica sanal Xbox 360 kolu olustur
gamepad      = 0
gamepad_name = Microsoft X-Box 360 pad

# --- Profil yonetimi ---
# On plandaki uygulamaya gore [app:paket] eslesmelerini otomatik sec
auto_profile    = 1
auto_profile_ms = 1500
# Acilista esleme aktif mi (0 ise F9 ile kendin acarsin)
enable_on_boot  = 1

[keys]
# Ozel kisayollar (Linux tus adi)
toggle_key    = F9     # eslemeyi AC/KAPA  (yazi yazacagin zaman kapat)
profile_key   = F10    # /data/adb/kbd2touch/profiles/*.ini arasinda dongu
calibrate_key = F11    # 4 koseye dokunarak rotation testi
# quit_key    = F12    # daemon'u tamamen durdur (varsayilan: kapali)

# ===================================================================
#  GENEL ESLESMELER  (her uygulamada calisir; [app:...] tanimli
#  eslesmeler on plandaki uygulama eslesirse bunlarin ONUNE gecer)
#
#  action = tap            -> tek dokunus      (x, y)
#  action = swipe          -> surukleme        (x, y) -> (x2, y2)
#  action = key            -> sanal klavyeden tus gonder (out_key)
#  action = gamepad_button -> sanal gamepad butonu (button = A/B/X/Y/LB/RB/START/SELECT)
#  action = gamepad_stick  -> sanal analog (axis = LX/LY/RX/RY, gx/gy = -32767..32767)
#
#  hold = 1      -> tus birakilana kadar basili tut (joystick/sprint icin sart)
#  repeat_ms = N -> tus basiliyken N ms'de bir tekrarla (otomatik ates vb.)
#  ms = N        -> tap icin basili kalma, swipe icin sure
# ===================================================================

# --- Sistem ---
[bind:ESC]
action = key
out_key = BACK
label   = geri

# --- Ornek: ekrana dokunma testi (istedigin yere tasi) ---
[bind:F1]
action = tap
x = 1440
y = 900
label = ekran ortasi testi
