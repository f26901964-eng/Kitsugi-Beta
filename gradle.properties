# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Gradle daemon heap: 8GB
org.gradle.jvmargs=-Xmx8192m -Xms2048m -XX:+UseG1GC -XX:SoftRefLRUPolicyMSPerMB=1 -Dfile.encoding=UTF-8

# Kotlin compiler daemon: 8GB
kotlin.daemon.jvmargs=-Xmx8192m -Xms2048m -XX:+UseG1GC

# ── Kotlin Incremental Derleme ────────────────────────────────────────────────
# Kotlin 2.0.21 + JDK 21: ABI snapshot tabanlı incremental derleme (önerilen yöntem)
kotlin.incremental=false
kotlin.incremental.useClasspathSnapshot=false

# ── Paralel Derleme ve Worker Thread'ler ──────────────────────────────────────
# 5900X'in 24 mantıksal çekirdeğinden 16'sını Gradle'a ver (8'i OS/IDE için)
org.gradle.parallel=true
org.gradle.workers.max=16

# ── Gradle Daemon (JVM sıcak kalır, sonraki buildler hızlanır) ───────────────
org.gradle.daemon=true
# Boşta kalan daemon'ların RAM işgal etmesini engelle: 60 saniye sonra otomatik kapanır (varsayılan 3 saattir)
org.gradle.daemon.idletimeout=60000

# ── Build Cache (değişmeyen task çıktılarını önbelleğe alır) ─────────────────
org.gradle.caching=true

# ── Android ──────────────────────────────────────────────────────────────────
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true