name: 🩺 Bangumi API Probe (geçici)

on:
  push:
    branches: ['arena/**']
    paths:
      - '.github/workflows/bangumi-probe.yml'
      - 'probe/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: Probe
        run: |
          set +e
          {
          UA_APP="f26901964-eng/Kitsugi-Beta/2.4.340-beta.1761 (Android) (https://github.com/f26901964-eng/Kitsugi-Beta)"
          probe() {
            local label="$1"; shift
            echo "===== $label ====="
            code=$(curl -sS -o /tmp/body.json -w '%{http_code}' -m 25 "$@")
            echo "HTTP $code  bytes=$(wc -c </tmp/body.json)"
            head -c 350 /tmp/body.json; echo
          }
          probe "A1 POST search score (app UA)" \
            -X POST 'https://api.bgm.tv/v0/search/subjects?limit=5&offset=0' \
            -H "User-Agent: $UA_APP" -H 'Accept: application/json' \
            -H 'Content-Type: application/json' \
            --data '{"keyword":"","sort":"score","filter":{"type":[2],"nsfw":false}}'
          probe "A2 POST search heat (app UA)" \
            -X POST 'https://api.bgm.tv/v0/search/subjects?limit=5&offset=0' \
            -H "User-Agent: $UA_APP" -H 'Accept: application/json' \
            -H 'Content-Type: application/json' \
            --data '{"keyword":"","sort":"heat","filter":{"type":[1],"nsfw":false}}'
          probe "A3 POST search match keyword (app UA)" \
            -X POST 'https://api.bgm.tv/v0/search/subjects?limit=5&offset=0' \
            -H "User-Agent: $UA_APP" -H 'Accept: application/json' \
            -H 'Content-Type: application/json' \
            --data '{"keyword":"chainsaw man","sort":"match","filter":{"type":[2],"nsfw":false}}'
          probe "A4 POST search rank (app UA)" \
            -X POST 'https://api.bgm.tv/v0/search/subjects?limit=5&offset=0' \
            -H "User-Agent: $UA_APP" -H 'Accept: application/json' \
            -H 'Content-Type: application/json' \
            --data '{"keyword":"","sort":"rank","filter":{"type":[2],"nsfw":false}}'
          probe "A5 POST search rank + rating_count (app UA)" \
            -X POST 'https://api.bgm.tv/v0/search/subjects?limit=5&offset=0' \
            -H "User-Agent: $UA_APP" -H 'Accept: application/json' \
            -H 'Content-Type: application/json' \
            --data '{"keyword":"","sort":"rank","filter":{"type":[2],"rating_count":[">=200"],"nsfw":false}}'
          probe "A6 POST search air_date + rating (app UA)" \
            -X POST 'https://api.bgm.tv/v0/search/subjects?limit=5&offset=0' \
            -H "User-Agent: $UA_APP" -H 'Accept: application/json' \
            -H 'Content-Type: application/json' \
            --data '{"keyword":"","sort":"match","filter":{"type":[2],"air_date":[">=2020-01-01","<=2024-12-31"],"rating":[">=8"],"nsfw":false}}'
          probe "A7 POST search tag (app UA)" \
            -X POST 'https://api.bgm.tv/v0/search/subjects?limit=5&offset=0' \
            -H "User-Agent: $UA_APP" -H 'Accept: application/json' \
            -H 'Content-Type: application/json' \
            --data '{"keyword":"","sort":"rank","filter":{"type":[2],"tag":["科幻"],"nsfw":false}}'
          probe "B1 POST search score (okhttp UA)" \
            -X POST 'https://api.bgm.tv/v0/search/subjects?limit=5&offset=0' \
            -H 'User-Agent: okhttp/4.12.0' -H 'Accept: application/json' \
            -H 'Content-Type: application/json' \
            --data '{"keyword":"","sort":"score","filter":{"type":[2],"nsfw":false}}'
          probe "C1 GET browse rank (app UA)" \
            'https://api.bgm.tv/v0/subjects?type=2&sort=rank&limit=5&offset=0' \
            -H "User-Agent: $UA_APP" -H 'Accept: application/json'
          probe "C2 GET browse season (app UA)" \
            'https://api.bgm.tv/v0/subjects?type=2&sort=date&year=2026&month=10&limit=5&offset=0' \
            -H "User-Agent: $UA_APP" -H 'Accept: application/json'
          probe "C3 GET real tv (app UA)" \
            'https://api.bgm.tv/v0/subjects?type=6&cat=6001&sort=rank&limit=5&offset=0' \
            -H "User-Agent: $UA_APP" -H 'Accept: application/json'
          probe "C4 GET legacy search (app UA)" \
            'https://api.bgm.tv/search/subject/chainsaw?type=2&responseGroup=large&start=0&max_results=5' \
            -H "User-Agent: $UA_APP" -H 'Accept: application/json'
          probe "D1 GET p1 subject (app UA)" \
            'https://next.bgm.tv/p1/subjects/326' \
            -H "User-Agent: $UA_APP" -H 'Accept: application/json'
          # ── Özet probe'ları (başlık + puan + oy + meta_tags) ─────────────
          summary() {
            local label="$1"; shift
            echo "===== $label ====="
            code=$(curl -sS -o /tmp/b.json -w '%{http_code}' -m 25 "$@")
            echo "HTTP $code"
            python3 probe/summarize.py /tmp/b.json
          }
          search() {
            local label="$1"; local body="$2"
            summary "$label" -X POST 'https://api.bgm.tv/v0/search/subjects?limit=5&offset=0' \
              -H "User-Agent: $UA_APP" -H 'Accept: application/json' \
              -H 'Content-Type: application/json' --data "$body"
          }
          get5() {
            local label="$1"; local url="$2"
            summary "$label" "$url" -H "User-Agent: $UA_APP" -H 'Accept: application/json'
          }
          # E: yeni "en yüksek puanlı" stratejisi (sort=rank + rank/rating_count tabanı)
          search "E1 rank + rank>=1 + rating_count>=100" '{"keyword":"","sort":"rank","filter":{"type":[2],"rank":[">=1"],"rating_count":[">=100"],"nsfw":false}}'
          search "E2 rank + rating_count>=100" '{"keyword":"","sort":"rank","filter":{"type":[2],"rating_count":[">=100"],"nsfw":false}}'
          search "E3 score + rating_count>=100" '{"keyword":"","sort":"score","filter":{"type":[2],"rating_count":[">=100"],"nsfw":false}}'
          search "E4 score (eski davranis)" '{"keyword":"","sort":"score","filter":{"type":[2],"nsfw":false}}'
          # F: REAL (sanci yuan) populerlik - meta_tags suzgeci
          search "F1 real tv heat meta_tags" '{"keyword":"","sort":"heat","filter":{"type":[6],"meta_tags":["电视剧"],"nsfw":false}}'
          search "F2 real movie heat meta_tags" '{"keyword":"","sort":"heat","filter":{"type":[6],"meta_tags":["电影"],"nsfw":false}}'
          # G: etiket cevirisi - Cince calisir, Turkce/Ingilizce calismaz (kanit)
          search "G1 tag kexue (Cince)" '{"keyword":"","sort":"rank","filter":{"type":[2],"tag":["科幻"],"nsfw":false}}'
          search "G2 tag Sci-Fi (Ingilizce)" '{"keyword":"","sort":"rank","filter":{"type":[2],"tag":["Sci-Fi"],"nsfw":false}}'
          search "G3 tag Bilim Kurgu (Turkce)" '{"keyword":"","sort":"rank","filter":{"type":[2],"tag":["Bilim Kurgu"],"nsfw":false}}'
          # H: kullanici sorgulari
          search "H1 match chainsaw man (anime)" '{"keyword":"chainsaw man","sort":"match","filter":{"type":[2],"nsfw":false}}'
          search "H2 match one piece (manga)" '{"keyword":"one piece","sort":"match","filter":{"type":[1],"nsfw":false}}'
          search "H3 match reply 1988 (real)" '{"keyword":"reply 1988","sort":"match","filter":{"type":[6],"nsfw":false}}'
          search "H4 heat anime (populer, suzgecsiz)" '{"keyword":"","sort":"heat","filter":{"type":[2],"nsfw":false}}'
          # I: film/manga kategorileri
          get5 "I1 anime movie cat=3 rank" 'https://api.bgm.tv/v0/subjects?type=2&cat=3&sort=rank&limit=5&offset=0'
          get5 "I2 manga cat=1001 date" 'https://api.bgm.tv/v0/subjects?type=1&cat=1001&sort=date&limit=5&offset=0'
          # J: yedek raflar ve kapsam yolları
          search "J1 topScored BOOK (rank+rank>=1+rating_count>=100)" '{"keyword":"","sort":"rank","filter":{"type":[1],"rank":[">=1"],"rating_count":[">=100"],"nsfw":false}}'
          get5 "J2 novels cat=1002 rank" 'https://api.bgm.tv/v0/subjects?type=1&cat=1002&sort=rank&limit=5&offset=0'
          get5 "J3 real browse (cat YOK) rank" 'https://api.bgm.tv/v0/subjects?type=6&sort=rank&limit=5&offset=0'
          search "J4 real + tag (电视剧 kapsaminda 剧情)" '{"keyword":"","sort":"rank","filter":{"type":[6],"tag":["剧情"],"nsfw":false}}'
          search "J5 real film + meta_tags + keyword" '{"keyword":"","sort":"heat","filter":{"type":[6],"meta_tags":["电影"],"nsfw":false}}'
          # K: arayüz tür çiplerinin sözlükten çevrilmiş Çince etiketleri (kapsama testi)
          tagtotal() {
            local tag="$1"
            local code
            code=$(curl -sS -o /tmp/t.json -w '%{http_code}' -m 25 \
              -X POST 'https://api.bgm.tv/v0/search/subjects?limit=1&offset=0' \
              -H "User-Agent: $UA_APP" -H 'Accept: application/json' \
              -H 'Content-Type: application/json' \
              --data "{\"keyword\":\"\",\"sort\":\"rank\",\"filter\":{\"type\":[2],\"tag\":[\"$tag\"],\"nsfw\":false}}")
            printf 'K %-12s HTTP %s ' "$tag" "$code"; python3 probe/total.py /tmp/t.json
          }
          tagtotal '剧情'; tagtotal '战斗'; tagtotal '恋爱'; tagtotal '搞笑'; tagtotal '奇幻'
          tagtotal '科幻'; tagtotal '悬疑'; tagtotal '恐怖'; tagtotal '日常'; tagtotal '冒险'
          tagtotal '灵异'; tagtotal '心理'; tagtotal '运动系'; tagtotal '悬疑惊悚'; tagtotal '机战'
          tagtotal '音乐'; tagtotal '历史'; tagtotal '军事'; tagtotal '校园'
          # L: zayıf çipler için alternatif Bangumi etiketleri
          tagtotal '超自然'; tagtotal '心理描写'; tagtotal '运动'; tagtotal '惊悚'
          tagtotal '战争'; tagtotal '历史剧'; tagtotal '军事冲突'; tagtotal '灵异'
          # M: etiket + rank süzgeci (ızgarada sıralama kalitesi)
          tag_order() {
            local tag="$1"
            local code
            code=$(curl -sS -o /tmp/t.json -w '%{http_code}' -m 25 \
              -X POST 'https://api.bgm.tv/v0/search/subjects?limit=3&offset=0' \
              -H "User-Agent: $UA_APP" -H 'Accept: application/json' \
              -H 'Content-Type: application/json' \
              --data "{\"keyword\":\"\",\"sort\":\"rank\",\"filter\":{\"type\":[2],\"tag\":[\"$tag\"],\"rank\":[\">=1\"],\"nsfw\":false}}")
            echo "===== M tag '$tag' + rank>=1 ====="
            echo "HTTP $code"
            python3 probe/summarize.py /tmp/t.json
          }
          tag_order '剧情'
          tag_order '战斗'
          tag_order '运动'
          echo "===== done ====="
          } > /tmp/probe.log 2>&1
          cat /tmp/probe.log

      - name: Sonucu depoya yaz
        run: |
          mkdir -p probe
          cp /tmp/probe.log probe/result.txt
          git config user.name "probe-bot"
          git config user.email "probe@example.com"
          git add probe/result.txt
          git commit -m "probe: sonuç" || true
          git push
