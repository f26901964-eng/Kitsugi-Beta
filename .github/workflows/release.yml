name: Build & Publish Release APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Surüm numarasi (orn: 2.4.191)'
        required: true
        default: '2.4.191'
      prerelease:
        description: 'Pre-release olarak isaretle?'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: write

jobs:
  release:
    name: Build Release APK and Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build FOSS Release APK
        run: ./gradlew assembleFossRelease --no-daemon
        env:
          JAVA_OPTS: "-Xmx4g"

      - name: Find APK
        id: find_apk
        run: |
          APK=$(find app/build/outputs/apk/foss/release -name "*.apk" | head -1)
          echo "apk_path=$APK" >> $GITHUB_OUTPUT
          echo "apk_name=$(basename $APK)" >> $GITHUB_OUTPUT
          echo "Found APK: $APK"

      - name: Prepare release notes
        id: notes
        run: |
          NOTES="release_notes_v${{ github.event.inputs.version }}.md"
          if [ ! -f "$NOTES" ]; then
            printf 'Kitsugi Beta v%s\n\nDetayli notlar icin depo gecmisine bakin.\n' "${{ github.event.inputs.version }}" > "$NOTES"
          fi
          echo "notes_file=$NOTES" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: Kitsugi Beta v${{ github.event.inputs.version }}
          prerelease: ${{ github.event.inputs.prerelease }}
          files: ${{ steps.find_apk.outputs.apk_path }}
          body_path: ${{ steps.notes.outputs.notes_file }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
