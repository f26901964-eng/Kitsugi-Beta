name: 🏗️ Android Derleme Doğrulama (geçici)

# Geçici doğrulama: Kotlin derleme hatalarını ve MAL cihaz ayrıştırıcı testlerini
# cihaza gerek kalmadan GitHub'da yakalar; foss debug APK'sını artifact olarak yükler.

on:
  push:
    branches: ['arena/**']
    paths:
      - 'app/**'
      - 'supabase/**'
      - 'scripts/account-tests/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      checks: write

    steps:
      - name: 📥 Repo klonla
        uses: actions/checkout@v4

      - name: 🧪 Hesap veritabanı güvenlik testleri
        run: |
          npm ci --prefix scripts/account-tests --ignore-scripts
          npm test --prefix scripts/account-tests

      - name: ☕ JDK 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🤖 Gradle kur + önbellek
        uses: gradle/actions/setup-gradle@v4

      - name: 📦 Eksik SDK paketlerini yükle
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "cmake;3.22.1" "platforms;android-36" "build-tools;36.0.0" 2>&1 | tail -n 5 || true

      - name: ⚙️ CI bellek ayarları
        run: |
          if [ ! -f /swapfile ]; then
            sudo dd if=/dev/zero of=/swapfile bs=1M count=6144 status=none
            sudo chmod 600 /swapfile
            sudo mkswap /swapfile
          fi
          sudo swapon /swapfile || echo "swapon atlandı"
          mkdir -p ~/.gradle
          cat > ~/.gradle/gradle.properties << 'EOP'
          org.gradle.jvmargs=-Xmx4g -Xms1g -Xss16m -XX:+UseG1GC -Dfile.encoding=UTF-8
          org.gradle.workers.max=1
          org.gradle.parallel=true
          org.gradle.daemon=true
          org.gradle.caching=true
          kotlin.daemon.jvmargs=-Xmx4g -Xms1g -Xss16m -XX:+UseG1GC
          kotlin.compiler.execution.strategy=daemon
          EOP

      - name: 🧪 MAL cihaz ayrıştırıcı testleri + eklenti güncelleme testleri + 🔨 foss debug & R8 release APK + DEX doğrulama
        run: |
          chmod +x gradlew
          set -o pipefail
          # Eklenti güncelleme tespiti (sürüm + içerik parmak izi), ayar migrasyon/yazmaç kalkanı
          # ve çökme tanı testleri çalıştırılır; ardından hem Debug hem de R8 küçültmeli Release
          # APK derlenip tüm classes*.dex buyruk akışları ikili düzeyde ART kurallarıyla doğrulanır.
          ./gradlew :app:testFossDebugUnitTest \
            --tests 'com.kitsugi.animelist.data.platform.*' \
            --tests 'com.kitsugi.animelist.ui.screens.profile.*' \
            --tests 'com.kitsugi.animelist.ui.screens.mylist.*' \
            --tests 'com.kitsugi.animelist.core.diagnostics.*' \
            --tests 'com.kitsugi.animelist.data.settings.*' \
            --tests 'com.kitsugi.animelist.data.account.*' \
            --tests 'com.kitsugi.animelist.data.notifications.NotificationArchiveStoreTest' \
            --tests 'com.kitsugi.animelist.core.notifications.*' \
            --tests 'com.kitsugi.animelist.core.player.*' \
            --tests 'com.kitsugi.animelist.core.player.engine.*' \
            --tests 'com.kitsugi.animelist.data.remote.malweb.*' \
            --tests 'com.kitsugi.animelist.data.cloudstream.CsPluginUpdateCheckerTest' \
            --tests 'com.kitsugi.animelist.data.remote.CloudstreamRepoMirrorTest' \
            --tests 'com.kitsugi.animelist.data.fandom.*' \
            --tests 'com.kitsugi.animelist.data.remote.MdbListClientTest' \
            --tests 'com.kitsugi.animelist.data.remote.anisub.*' \
            --tests 'com.kitsugi.animelist.data.auth.*' \
            --tests 'com.kitsugi.animelist.data.local.*' \
            --tests 'com.kitsugi.animelist.model.*' \
            --tests 'com.kitsugi.animelist.data.remote.BangumiIdNamespaceTest' \
            --tests 'com.kitsugi.animelist.data.remote.BangumiLibraryTitleHydratorTest' \
            --tests 'com.kitsugi.animelist.data.remote.ShikimoriPosterResolverTest' \
            --tests 'com.kitsugi.animelist.utils.BangumiDisplayTitleLanguageTest' \
            --tests 'com.kitsugi.animelist.utils.BangumiMasterDictionaryTest' \
            --tests 'com.kitsugi.animelist.utils.KitsugiTranslationsTest' \
            --tests 'com.kitsugi.animelist.data.remote.BangumiSubjectTitleResolverTest' \
            --tests 'com.kitsugi.animelist.data.remote.BangumiTitleCacheTest' \
            --tests 'com.kitsugi.animelist.data.remote.KitsugiBangumiDetailClientTest' \
            --tests 'com.kitsugi.animelist.data.remote.KitsugiBangumiClientTitleTest' \
            --tests 'com.kitsugi.animelist.ui.screens.explore.HeroSelectionTest' \
            --tests 'com.kitsugi.animelist.ui.screens.explore.AllSourcesExploreTest' \
            --tests 'com.kitsugi.animelist.ui.components.HomeHeroPolicyTest' \
            --tests 'com.kitsugi.animelist.ui.components.HeroImageSelectionTest' \
            --tests 'com.kitsugi.animelist.ui.components.HomeHeroGestureModifiersTest' \
            --tests 'com.kitsugi.animelist.ui.utils.LazyKeyDedupTest' \
            --tests 'com.kitsugi.animelist.data.remote.KitsugiReviewStableKeyTest' \
            :app:assembleFossDebug :app:assembleFossRelease --stacktrace --console=plain 2>&1 | tee build.log
          python3 scripts/verify_apk_dex_bytecode.py \
            app/build/outputs/apk/foss/debug/*.apk \
            app/build/outputs/apk/foss/release/*.apk 2>&1 | tee -a build.log
        env:
          GRADLE_OPTS: -Dfile.encoding=UTF-8

      - name: 📲 APK'ları yükle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kitsugi-foss-apks
          path: |
            app/build/outputs/apk/foss/debug/*.apk
            app/build/outputs/apk/foss/release/*.apk
          retention-days: 7

      - name: ✅ Başarılı derleme + DEX doğrulama kanıtını kontrol çalışmasına yaz
        if: success()
        run: |
          SUMMARY=$(grep -E "\[DEX-OK\]|BUILD SUCCESSFUL" build.log 2>/dev/null | tail -n 20 | tr '\n' '|')
          jq -n --arg sha "$GITHUB_SHA" --arg s "$SUMMARY" \
            '{name:"dex-verification-proof", head_sha:$sha, status:"completed", conclusion:"success",
              output:{title:"R8 Release & Debug DEX Bytecode Verification", summary:$s}}' > /tmp/check-run-ok.json
          curl -sS -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/check-runs" \
            -d @/tmp/check-run-ok.json | head -c 300

      - name: 🩺 Derleme günlüğünü yükle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7

      - name: 🩺 Derleyici yığın izini kontrol çalışmasına yaz
        # Kotlin derleyicisi iç hatası (StackOverflowError / ICE) durumunda tek satırlık
        # özet yetmez: hangi dosya/sınıf üzerinde patladığını görmek için izin ilk 60
        # satırı ayrı bir check-run olarak yayınlanır (log artifact'i indirilemediğinde
        # GitHub API'sinden okunabilir).
        if: failure()
        run: |
          LINE=$(grep -nE "StackOverflowError|Internal compiler error|e: java\.lang\." build.log 2>/dev/null | head -1 | cut -d: -f1)
          if [ -z "$LINE" ]; then LINE=1; fi
          DETAIL=$(sed -n "${LINE},$((LINE+70))p" build.log 2>/dev/null | cut -c1-320 | tr '\n' '|')
          if [ -z "$DETAIL" ]; then DETAIL="iz bulunamadi"; fi
          jq -n --arg sha "$GITHUB_SHA" --arg s "$DETAIL" \
            '{name:"compiler-stack-detail", head_sha:$sha, status:"completed", conclusion:"neutral",
              output:{title:"Derleyici yigin izi", summary:$s}}' > /tmp/check-run-detail.json
          curl -sS -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/check-runs" \
            -d @/tmp/check-run-detail.json | head -c 300

      - name: 🩺 Hata özetini kontrol çalışmasına yaz
        # Artifact indirme bazı ortamlarda engellendiği için derleme hatası özeti
        # GitHub API'sinden okunabilen bir check-run çıktısı olarak da yayınlanır:
        #   gh api /repos/{owner}/{repo}/commits/{sha}/check-runs
        if: failure()
        run: |
          SUMMARY=$(grep -nE "^e: |FAILED|Execution failed|error:|Caused by|What went wrong|Compilation error|> Task .*(FAILED|failed)" build.log 2>/dev/null | tail -n 80 | cut -c1-400 | tr '\n' '|')
          # Birim testi assertion ayrintisi (expected/actual) konsola yazilmaz; JUnit XML
          # raporundan cekip ozete ekle (artifact indirme bazi ortamlarda engelli oldugu icin).
          TESTDETAIL=$(python3 - <<'PYEOF' 2>/dev/null | tail -n 40 | cut -c1-600 | tr '\n' '|'
          import glob, xml.etree.ElementTree as ET
          for path in glob.glob("app/build/test-results/**/TEST-*.xml", recursive=True):
              try:
                  root = ET.parse(path).getroot()
              except Exception:
                  continue
              for case in root.iter("testcase"):
                  for fail in list(case.iter("failure")) + list(case.iter("error")):
                      msg = (fail.get("message") or "").strip().replace("\n", " ")
                      print(f"{case.get('classname')} > {case.get('name')}: {msg}")
          PYEOF
          )
          if [ -n "$TESTDETAIL" ]; then SUMMARY="${SUMMARY}||TEST-DETAIL|${TESTDETAIL}"; fi
          if [ -z "$SUMMARY" ]; then SUMMARY=$(tail -c 2000 build.log 2>/dev/null | tr '\n' '|'); fi
          if [ -z "$SUMMARY" ]; then SUMMARY="build.log bulunamadi"; fi
          jq -n --arg sha "$GITHUB_SHA" --arg s "$SUMMARY" \
            '{name:"build-log-summary", head_sha:$sha, status:"completed", conclusion:"neutral",
              output:{title:"Gradle hata ozeti", summary:$s}}' > /tmp/check-run-payload.json
          curl -sS -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/check-runs" \
            -d @/tmp/check-run-payload.json | head -c 400
