name: Manga-TR Android integration

on:
  push:
    branches: ['arena/**']
    paths:
      - 'app/src/main/java/com/kitsugi/animelist/data/manga/**'
      - 'app/src/main/java/eu/kanade/tachiyomi/**'
      - 'app/src/androidTest/java/com/kitsugi/animelist/data/manga/**'
      - 'app/build.gradle.kts'
      - 'app/proguard-rules.pro'
      - '.github/workflows/mangatr-emulator.yml'
  workflow_dispatch:

concurrency:
  group: manga-tr-emulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Download checksum-pinned published APK test fixture
        run: |
          mkdir -p app/src/androidTest/assets
          curl --fail --location --retry 3 \
            -H 'Accept: application/vnd.github.raw+json' \
            'https://api.github.com/repos/f26901964-eng/Kitsugi-Manga-Plugins/contents/apk/tachiyomi-tr.mangatr-v1.6.26.apk?ref=245c305f' \
            -o app/src/androidTest/assets/mangatr-v24.apk
          echo '1392f9f4e9cc52b23bf018a394ae94a0f0fe19249bd65ac69f2266b3b81687a8  app/src/androidTest/assets/mangatr-v24.apk' | sha256sum -c -
          curl --fail --location --retry 3 \
            -H 'Accept: application/vnd.github.raw+json' \
            'https://api.github.com/repos/f26901964-eng/Kitsugi-Manga-Plugins/contents/apk/tachiyomi-tr.mangatr-v1.6.26.apk?ref=bca61cbff15930394f3c87fac9ce556b041c7bac' \
            -o app/src/androidTest/assets/mangatr-v26.apk
          echo '17694bbcbb7ade8e9a03fcd60c3ce4fb24633b0312a5e82a5ddee9bfc83360f9  app/src/androidTest/assets/mangatr-v26.apk' | sha256sum -c -
      - name: Install Android build components
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "cmake;3.22.1" "platforms;android-36" "build-tools;36.0.0"
      - name: Compile app and instrumentation APK before starting emulator
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleFossDebug :app:assembleFossDebugAndroidTest --stacktrace --console=plain --no-daemon -PmangaEmulatorX86_64=true
          ./gradlew --stop
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            ./gradlew :app:connectedFossDebugAndroidTest --stacktrace --console=plain -PmangaEmulatorX86_64=true -Pandroid.testInstrumentationRunnerArguments.class=com.kitsugi.animelist.data.manga.MihonMangaIntegrationTest,com.kitsugi.animelist.data.manga.MangaTrPublishedApkTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mangatr-instrumentation-report
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
