name: Android Release APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - "arena/ff88c0a0-kitsugi-beta"
    paths:
      - ".github/workflows/android-release.yml"
      - "app/**"
      - "fastlane/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradlew"

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release-apks:
    name: Build and verify FOSS + GMS APKs
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "cmake;3.22.1" \
            "ndk;27.2.12479018"

      - name: Decode and validate signing keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [[ -z "${KEYSTORE_BASE64:-}" || -z "${KEYSTORE_PASSWORD:-}" || -z "${KEY_ALIAS:-}" ]]; then
            echo "::error::One or more Android signing secrets are missing."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/signing"
          key_file="$GITHUB_WORKSPACE/signing/debug.keystore"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$key_file"
          chmod 600 "$key_file"
          if [[ ! -s "$key_file" ]]; then
            echo "::error::Decoded keystore is empty."
            exit 1
          fi

          # Check that the secret decodes to a readable keystore with the configured alias.
          keytool -list -keystore "$key_file" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "KEYSTORE_FILE=$key_file" >> "$GITHUB_ENV"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install Fastlane
        run: gem install fastlane --no-document

      - name: Build both signed release variants
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set +e
          build_log="$RUNNER_TEMP/kitsugi-fastlane-build.log"
          fastlane android production > "$build_log" 2>&1
          build_status=$?

          if [[ "$build_status" -ne 0 ]]; then
            python3 - "$build_log" <<'PY'
          import os
          import re
          import sys

          with open(sys.argv[1], encoding="utf-8", errors="replace") as log_file:
              lines = log_file.read().splitlines()

          patterns = re.compile(
              r"FAILURE:|What went wrong:|Execution failed for task|Could not |"
              r"Caused by:|Exception|(^|\s)e: |error:|Task .* FAILED|BUILD FAILED"
          )
          diagnostics = [line for line in lines if patterns.search(line)]
          if not diagnostics:
              diagnostics = [line for line in lines if line.strip()][-20:]

          secrets = {
              os.environ.get(name, "")
              for name in ("KEYSTORE_PASSWORD", "KEY_ALIAS", "KEY_PASSWORD")
              if os.environ.get(name)
          }
          for line in diagnostics[-30:]:
              for secret in secrets:
                  line = line.replace(secret, "[REDACTED]")
              line = line.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error title=Fastlane/Gradle diagnostic::{line[:1000]}")
          PY
          else
            echo "Fastlane completed; filtered output tail:"
            tail -n 25 "$build_log"
          fi

          rm -f "$build_log"
          exit "$build_status"

      - name: Verify APK signatures match existing installations
        shell: bash
        env:
          EXPECTED_CERT_SHA256: A53115764FF5E259E0E5ACEC3C58A85166E88AAD110CD8A20674EEFEA5D6C016
        run: |
          set -euo pipefail
          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          for flavor in foss gms; do
            apk_dir="app/build/outputs/apk/$flavor/release"
            mapfile -t apks < <(find "$apk_dir" -maxdepth 1 -type f -name '*.apk' -print | sort)
            if [[ "${#apks[@]}" -ne 1 ]]; then
              echo "::error::Expected one $flavor release APK in $apk_dir; found ${#apks[@]}."
              exit 1
            fi

            signer_digest="$("$apksigner" verify --print-certs "${apks[0]}" 2>&1 | awk -F': ' 'tolower($0) ~ /certificate sha-256 digest:/ { gsub(/:/, "", $NF); print toupper($NF); exit }')"
            if [[ "$signer_digest" != "$EXPECTED_CERT_SHA256" ]]; then
              echo "::error::The $flavor APK signer does not match the certificate used by existing installs."
              exit 1
            fi
            echo "Verified $flavor APK signature against the existing-install certificate."
          done

      - name: Upload verified APK build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kitsugi-release-apks-${{ github.run_number }}
          path: app/build/outputs/apk/*/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Remove signing keystore from workspace
        if: always()
        shell: bash
        run: rm -f signing/debug.keystore
