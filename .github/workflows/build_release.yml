name: Build and Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to attach APK (defaults to latest release if empty)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Upload APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build FOSS Debug APK
        run: ./gradlew :app:assembleFossDebug --no-daemon --stacktrace

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kitsugi-Beta-FOSS-Debug
          path: app/build/outputs/apk/foss/debug/*.apk

      - name: Upload APK to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK_FILE=$(find app/build/outputs/apk/foss/debug -name "*.apk" | head -n 1)
          echo "Found APK: $APK_FILE"
          
          # Target tag
          TARGET_TAG="${{ github.event.inputs.tag_name }}"
          if [ -z "$TARGET_TAG" ]; then
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then
              TARGET_TAG="${GITHUB_REF#refs/tags/}"
            else
              TARGET_TAG=$(gh release list --limit 1 --json tagName --jq '.[0].tagName')
            fi
          fi
          
          echo "Target Release Tag: $TARGET_TAG"
          gh release upload "$TARGET_TAG" "$APK_FILE" --clobber --repo "${{ github.repository }}"
