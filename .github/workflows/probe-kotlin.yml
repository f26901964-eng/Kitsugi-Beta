name: 🧪 Kotlin Derleme Günlüğü (geçici)

# Geçici teşhis iş akışı.
#
# Neden: GitHub Actions günlükleri ve artifact'leri bu sandbox'tan indirilemiyor
# (`results-receiver` / blob depolama erişimi EOF veriyor). Bu iş akışı derleme
# çıktısını doğrudan depoya (`probe/kotlin_log.txt`) yazıyor; böylece hata metni
# `git pull` ile okunabiliyor.

on:
  push:
    branches: ['arena/**']
    paths:
      - '.github/workflows/probe-kotlin.yml'
      - 'probe/kotlin-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: probe-kotlin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 📥 Repo klonla
        uses: actions/checkout@v4

      - name: ☕ JDK 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🤖 Gradle kur + önbellek
        uses: gradle/actions/setup-gradle@v4

      - name: 📦 Eksik SDK paketlerini yükle
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" 2>&1 | tail -n 3 || true

      - name: ⚙️ CI bellek ayarları
        run: |
          if [ ! -f /swapfile ]; then
            sudo dd if=/dev/zero of=/swapfile bs=1M count=6144 status=none
            sudo chmod 600 /swapfile
            sudo mkswap /swapfile
          fi
          sudo swapon /swapfile || echo "swapon atlandı"
          mkdir -p ~/.gradle
          cat > ~/.gradle/gradle.properties << 'EOP'
          org.gradle.jvmargs=-Xmx4g -Xms1g -Xss16m -XX:+UseG1GC -Dfile.encoding=UTF-8
          org.gradle.workers.max=1
          org.gradle.parallel=true
          org.gradle.daemon=false
          org.gradle.caching=true
          kotlin.daemon.jvmargs=-Xmx4g -Xms1g -Xss16m -XX:+UseG1GC
          EOP

      - name: 🔨 Kotlin derlemesi (günlük depoya yazılır)
        run: |
          chmod +x gradlew
          set +e
          ./gradlew :app:compileFossDebugKotlin --console=plain --stacktrace \
            > /tmp/kotlin.log 2>&1
          echo "exit=$?" >> /tmp/kotlin.log
          # Hata ayıklama için son 600 satır yeterli; deposu şişirmeyelim.
          tail -n 600 /tmp/kotlin.log > /tmp/kotlin-tail.log
          mkdir -p probe
          {
            echo "### :app:compileFossDebugKotlin"
            echo "commit: $(git rev-parse --short HEAD)"
            echo "date: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            grep -E "^(e: |w: .*Bangumi|BUILD |FAILURE|exit=)" /tmp/kotlin.log | tail -n 80
            echo "----- son 600 satır -----"
            cat /tmp/kotlin-tail.log
          } > probe/kotlin_log.txt
          tail -n 5 probe/kotlin_log.txt

      - name: 📤 Günlüğü depoya yaz
        if: always()
        run: |
          git config user.name "probe-bot"
          git config user.email "probe@example.com"
          # `*.log` .gitignore'da olduğu için dosya adı `.txt`; `-f` yine de garanti eder.
          git add -f probe/kotlin_log.txt
          git commit -m "probe: kotlin derleme günlüğü" || true
          for i in 1 2 3; do
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}" || git rebase --abort || true
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "günlük gönderildi"
              break
            fi
            sleep 5
          done
          git status --short | head -5
